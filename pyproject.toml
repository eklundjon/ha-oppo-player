[tool.ruff]
line-length = 100
# Minimum supported Home Assistant (hacs.json) is 2025.2, which runs on
# Python 3.13+. Target that so `UP` doesn't suggest newer-only syntax.
target-version = "py313"
# The vendored SDK is upstream code kept byte-verbatim as a diff baseline; it is
# not linted to our rules. Fixes to it are made deliberately, not by the linter.
extend-exclude = ["custom_components/oppo_player/oppoudpsdk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Modules inherited from upstream (simbaja) that predate our linting: star
# imports (F403/F405), long lines (E501), and broad excepts (E722/BLE001).
# New code is linted strictly; these are cleaned up incrementally — manager.py's
# connection layer is replaced wholesale in the Phase 4 refactor, and
# media_player's ATTR_* star import goes away with the diagnostic-sensor split.
"custom_components/oppo_player/media_player.py" = ["F403", "F405", "E501"]
"custom_components/oppo_player/musicbrainz.py" = ["F403", "F405", "BLE001"]
