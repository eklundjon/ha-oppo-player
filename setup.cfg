[tool:pytest]
testpaths = tests
asyncio_mode = auto

[coverage:run]
# Coverage is measured for our own code only. The vendored SDK
# (custom_components/oppo_player/oppoudpsdk) is upstream code we kept verbatim; its
# connection/lifecycle layer is slated for replacement in the Phase 4 refactor,
# so testing it now would be throwaway and would drown the meaningful number.
omit =
    custom_components/oppo_player/oppoudpsdk/*
